spring:
  application:
    name: jobmatcher

  datasource:
    url: jdbc:postgresql://localhost:5432/jobmatcher
    username: jobmatcher
    password: dev_password
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: 8080
  error:
    include-message: always
    include-stacktrace: never

app:
  jwt:
    secret: ${JWT_SECRET:}          # env'den gelsin, boşsa uygulama açılmasın
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    issuer: jobmatcher
  storage:
    resume-path: ./storage/resumes   # dosya yolu config'den, koda gömme

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.seninpaket.jobmatcher: DEBUG   # kendi paket adınla değiştir
    org.hibernate.SQL: DEBUG