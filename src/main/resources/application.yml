spring:
  application:
    name: jobmatcher

  datasource:
    url: jdbc:postgresql://localhost:5432/jobmatcher
    username: ${DB_USERNAME:jobmatcher}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: 8080
  servlet:
    context-path: /api

jwt:
  secret: ${JWT_SECRET:}
  access-token-ttl: 15m
  refresh-token-ttl: 7d
  issuer: jobmatcher

app:
  storage:
    resume-path: ./storage/resumes
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.example.job_matchwer: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.security: DEBUG