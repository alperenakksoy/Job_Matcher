spring:
  application:
    name: jobmatcher

  datasource:
    url: jdbc:postgresql://localhost:5432/jobmatcher
    username: ${DB_USERNAME:jobmatcher}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: 8080
  servlet:
    context-path: /api

jwt:
  secret: ${JWT_SECRET:}
  access-token-ttl: 15m
  refresh-token-ttl: 7d
  issuer: jobmatcher

integrations:
  arbeitnow:
    base-url: https://www.arbeitnow.com/api/job-board-api

ingestion:
  arbeitnow:
    # Every 30 minutes. Override per-environment (e.g. shorter for local testing).
    cron: "0 */30 * * * *"

app:
  storage:
    resume-path: ./storage/resumes

ml-service:
  grpc:
    host: localhost
    port: 50051

resilience4j:
  circuitbreaker:
    instances:
      ml-service:
        # Of the last 10 calls, if 50% failed, trip the breaker.
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        # Stay OPEN (fail fast, skip the fallback... call ml-service) for 30s
        # before allowing a trial call through again.
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
  timelimiter:
    instances:
      ml-service:
        # ParseResume involves an LLM call on the Python side for missing
        # fields - give it real headroom, but don't let a hung call block
        # the upload request forever.
        timeout-duration: 15s
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.example.job_matchwer: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.security: DEBUG