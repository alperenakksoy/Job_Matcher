[project]
name = "job-matcher-ml-service"
version = "0.1.0"
description = "Deterministic + LLM-assisted resume/job parsing and matching service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "grpcio>=1.68.0",
    "grpcio-tools>=1.68.0",
    "pymupdf>=1.24.0",
    "spacy>=3.8.0",
    "pydantic>=2.9.0",
    "psycopg[binary]>=3.2.0",
    "redis>=5.2.0",
    "instructor>=1.7.0",
    "google-genai>=0.3.0",
    "groq>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]
